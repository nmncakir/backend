syntax = "proto3";
package notification;
import "google/protobuf/empty.proto";

service NotificationService {
    rpc SendEmail(SendEmailRequest) returns (google.protobuf.Empty);
}

message SendEmailRequest {
    string email = 1;
    string subject = 2;
    string body = 3;
}

message SendEmailResponse {
    string message = 1;
}